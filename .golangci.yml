version: "2"

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  disable:
    - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - linters:
        - staticcheck
      text: "SA1019.*github.com/golang/protobuf/proto.*is deprecated"
