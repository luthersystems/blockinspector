version: 2

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/luthersystems/blockinspector
  govet:
    check-shadowing: true
  misspell:
    locale: US

linters:
  enable:
    - errcheck
    - goimports
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
