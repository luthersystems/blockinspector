version: 2

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/luthersystems/blockinspector
  govet:
    check-shadowing: true
  misspell:
    locale: US

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  disable:
    - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: internal/ledger/chaininfo\.go
      linters:
        - staticcheck
      text: "SA1019"
