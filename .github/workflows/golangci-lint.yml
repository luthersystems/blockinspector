name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: an unpinned release built with an older Go refuses a
          # module whose go directive is newer, which would turn lint red with
          # no code change. v2.13.2 is the version svc and elps use.
          version: v2.13.2
