name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: an unpinned release built with an older Go refuses a
          # module whose go directive is newer, which would turn lint red with
          # no code change. v2.15.0 is the version the org Quality workflow
          # uses; v2.13.2 cannot read go1.27 export data ("could not import
          # fmt ... cannot decode").
          version: v2.15.0
